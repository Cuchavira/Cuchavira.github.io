    <!-- Noto Sans SC for Chinese, Fredoka for numbers -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300;400;600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Noto Sans SC', 'Fredoka', sans-serif;
        background-color: #fff5f7;
        overflow: hidden;
        user-select: none;
      }
      
      /* Animations */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      
      @keyframes ripple {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(2.5); opacity: 0; }
      }

      @keyframes popIn {
        0% { transform: scale(0) rotate(-180deg); opacity: 0; }
        80% { transform: scale(1.1) rotate(10deg); opacity: 1; }
        100% { transform: scale(1) rotate(0deg); opacity: 1; }
      }

      .animate-float {
        animation: float 4s ease-in-out infinite;
      }
      
      .animate-pop-in {
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      .ripple-effect {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.6);
        border: 2px solid #ec4899;
        animation: ripple 0.6s linear forwards;
        pointer-events: none;
        width: 60px;
        height: 60px;
        margin-left: -30px;
        margin-top: -30px;
        z-index: 40;
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #f9a8d4; border-radius: 4px; }
    </style>
